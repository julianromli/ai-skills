<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>allow-discrete sidebar demo</title>
<style>
  :root {
    --bg: #f4f4f3; --panel: #fff; --ink: #1a1a1a; --muted: #6b6b6b;
    --line: rgb(0 0 0 / 0.08); --hover: rgb(0 0 0 / 0.04); --active: rgb(0 0 0 / 0.07);
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f0f10; --panel: #161718; --ink: #ededed; --muted: #9a9a9a;
      --line: rgb(255 255 255 / 0.08); --hover: rgb(255 255 255 / 0.04); --active: rgb(255 255 255 / 0.10);
      color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; gap: 24px;
    background: var(--bg); color: var(--ink); font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased; }
  main { display: grid; gap: 20px; justify-items: center; padding: 32px 16px; }
  .stage { display: flex; gap: 32px; flex-wrap: wrap; justify-content: center; align-items: start; }
  figure { margin: 0; display: grid; gap: 10px; justify-items: center; }
  figcaption { font: 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }

  .sidebar { width: 184px; padding: 6px; background: var(--panel); border-radius: 12px;
    box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgb(0 0 0 / 0.04);
    transition: width 200ms var(--ease-out); overflow: hidden; }
  .sidebar[data-collapsed] { width: 44px; }
  .sidebar ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
  .sidebar a { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 9px;
    border-radius: 7px; color: inherit; text-decoration: none; white-space: nowrap;
    transition: background-color 150ms ease; }
  @media (hover: hover) { .sidebar a:hover { background: var(--hover); } }
  .sidebar a[aria-current="page"] { background: var(--active); }
  .sidebar a:focus-visible { outline: 2px solid currentColor; outline-offset: -2px; }
  .sidebar svg { flex: none; width: 16px; height: 16px; }

  /* The label. Only the second sidebar opts into allow-discrete. */
  .label { opacity: 1; transition: opacity 150ms ease-out, display 150ms; }
  .sidebar[data-collapsed] .label { opacity: 0; display: none; }
  .discrete .label { transition: opacity 150ms ease-out, display 150ms allow-discrete; }
  @starting-style { .discrete .label { opacity: 0; } }

  button.toggle { height: 36px; padding: 0 16px; border: 0; border-radius: 9px; cursor: pointer;
    background: var(--ink); color: var(--panel); font: 500 13px/1 inherit; font-family: inherit;
    transition: transform 150ms var(--ease-out); }
  button.toggle:active { transform: scale(0.97); }
  button.toggle:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .note { max-width: 46ch; text-align: center; color: var(--muted); margin: 0; text-wrap: pretty; }

  @media (prefers-reduced-motion: reduce) {
    .sidebar, .label, .discrete .label { transition: none; }
  }
</style>
</head>
<body>
<main>
  <div class="stage">
    <figure>
      <nav class="sidebar" id="sb-normal" aria-label="Normal"><ul data-items></ul></nav>
      <figcaption>transition-behavior: normal;</figcaption>
    </figure>
    <figure>
      <nav class="sidebar discrete" id="sb-discrete" aria-label="Allow discrete"><ul data-items></ul></nav>
      <figcaption>transition-behavior: allow-discrete;</figcaption>
    </figure>
  </div>
  <button class="toggle" type="button" aria-expanded="true" aria-controls="sb-normal sb-discrete">Collapse sidebars</button>
  <p class="note">Dummy data. On the left the labels vanish at once. On the right they fade out first, then <code>display: none</code> applies.</p>
</main>
<script>
  const icon = d => `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const items = [
    ['Home', '<path d="M2.5 7 8 2.5 13.5 7v6.5h-11z"/>'],
    ['Search', '<circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/>'],
    ['Inbox', '<path d="M2.5 9.5h3l1 1.5h3l1-1.5h3"/><rect x="2.5" y="3" width="11" height="10" rx="2"/>'],
    ['Files', '<path d="M2.5 4.5a1 1 0 0 1 1-1h3l1.5 1.5h4.5a1 1 0 0 1 1 1v6.5a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1z"/>'],
    ['Calendar', '<rect x="2.5" y="3.5" width="11" height="10" rx="2"/><path d="M2.5 6.5h11M5.5 2v3M10.5 2v3"/>'],
    ['Bookmarks', '<path d="M4.5 2.5h7v11L8 11l-3.5 2.5z"/>'],
    ['Analytics', '<rect x="2.5" y="2.5" width="11" height="11" rx="2"/><path d="M5.5 10.5v-2M8 10.5v-5M10.5 10.5v-3"/>'],
    ['Notifications', '<path d="M4 11.5V7a4 4 0 0 1 8 0v4.5l1 1H3zM6.5 13.5a1.5 1.5 0 0 0 3 0"/>'],
    ['Profile', '<circle cx="8" cy="5.5" r="2.5"/><path d="M3.5 13.5a4.5 4.5 0 0 1 9 0"/>'],
    ['Settings', '<circle cx="8" cy="8" r="2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/>'],
  ];
  document.querySelectorAll('[data-items]').forEach(ul => {
    ul.innerHTML = items.map(([name, d], i) =>
      `<li><a href="#" ${i === 0 ? 'aria-current="page"' : ''} title="${name}" aria-label="${name}">${icon(d)}<span class="label">${name}</span></a></li>`
    ).join('');
  });
  const btn = document.querySelector('.toggle');
  btn.addEventListener('click', () => {
    const collapsed = btn.getAttribute('aria-expanded') === 'true';
    btn.setAttribute('aria-expanded', String(!collapsed));
    btn.textContent = collapsed ? 'Expand sidebars' : 'Collapse sidebars';
    document.querySelectorAll('.sidebar').forEach(s => s.toggleAttribute('data-collapsed', collapsed));
  });
  document.querySelectorAll('.sidebar a').forEach(a => a.addEventListener('click', e => e.preventDefault()));
</script>
</body>
</html>
